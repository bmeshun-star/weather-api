apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-deployment
  namespace: weather-app
spec:
 replicas: 1
 selector:
   matchLabels:
     app: alert
 template:
  metadata:
   labels:
     app: alert
  spec:
   containers:
    - name: alert-service
      image: ghcr.io/bmeshun-star/alert-service:latest
      ports:
       - containerPort: 8001